[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-mcp"
version = "0.2.0"
description = "Mu2e knowledge base and retrieval system with MCP interface"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Core dependencies - includes everything needed for server, KB, parsing, LLM, chunking, embedding, and imports
dependencies = [
    "python-dotenv>=1.0.0",

    # Server dependencies
    "mcp<1.23.0", # version 1.23 adds Host checking that doesn't work inside dockers but doesn't yet allow to disable it. Update when new version is avaiable.
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",

    # KB dependencies (database)
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",

    # Parser dependencies
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "python-magic>=0.4.27",
    "python-pptx>=0.6.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",

    # LLM dependencies
    "openai>=1.0.0",

    # Chunking dependencies
    "tiktoken>=0.5.0",

    # Plotting dependencies
    "matplotlib>=3.7.0",

    # Embedding dependencies
    "sentence-transformers>=2.2.0",
    "pgvector>=0.2.0",  # PostgreSQL vector extension support
]

[project.optional-dependencies]
# Google Cloud Platform integration (Firestore for session storage)
gcp = [
    "google-cloud-firestore>=2.14.0",
]

# Documentation dependencies (for building docs with MkDocs)
doc = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

# Test dependencies
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fastapi[all]", # For TestClient and web testing
    "reportlab",
]

# ALCF
alcf = [
    "globus_sdk"
]

# Azure AI Document Intelligence parser
azure = [
    "azure-ai-documentintelligence>=1.0.0",
]

# IBM Docling — high-quality PDF → Markdown via DocLayNet + TableFormer.
# Optional because the model weights are large (~500 MB) and download from
# Hugging Face on first use (set HF_HOME to a roomy cache location).
docling = [
    "docling>=2.91.0",
]

# Marker-pdf — alternative high-quality PDF → Markdown parser kept for
# benchmarking against Docling. Same caveat about model weights.
marker = [
    "marker-pdf",
]

[project.scripts]
# Server module CLI commands
kb-server = "kb_mcp.server.server:main"
kb-server-stdio = "kb_mcp.server.mcp_stdio:main"
kb-server-manage-keys = "kb_mcp.server.oauth.cli_manage_keys:main"

# Knowledge Base module CLI commands
kb = "kb_mcp.kb.cli.__main__:main"

# Import module CLI commands
kb-import = "kb_mcp.imports.cli:main"

# Parser module CLI commands
kb-parse = "kb_mcp.parser.cli:main"

# Agent module CLI commands
kb-agent = "kb_mcp.agents.cli:main"

[project.urls]
Repository = "https://github.com/corrodis/kb-mcp"
