[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-mcp"
version = "0.1.0"
description = "Minimal streamable-http MCP server with GitHub OAuth authentication"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.1.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
gcp = [
    "google-cloud-firestore>=2.14.0",
]

[project.scripts]
test-mcp = "test_mcp.server:main"
test-mcp-manage-keys = "test_mcp.cli.manage_keys:main"

[project.urls]
Repository = "https://github.com/corrodis/test-mcp"
