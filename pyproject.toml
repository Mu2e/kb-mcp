[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-mcp"
# Single source of truth is kb_mcp.__version__ (see [tool.hatch.version]
# below), so the version reported over MCP cannot drift from the released
# artifact. Release: bump __version__, commit, then tag v<version>.
dynamic = ["version"]
description = "Mu2e knowledge base and retrieval system with MCP interface"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Core dependencies -- everything needed to SERVE the knowledge base with the
# default configuration: the MCP endpoint, the web UI, search/graph reads, and
# embedding the query itself.
#
# sentence-transformers is core rather than an extra because the default
# embedding provider IS sentence-transformers (EMBEDDING_PROVIDER defaults to
# "st", BAAI/bge-small-en-v1.5 -- see kb.embedding.utils.DEFAULT_PROVIDER). A
# plain install that could not run its own default configuration would fail on
# the first search, so the install and the defaults have to agree.
#
# NOTE: on Linux this resolves torch to the CUDA build from PyPI, which is
# several GB. Embedding one query at a time is CPU work, so deployments should
# install the +cpu wheel first:
#     pip install --index-url https://download.pytorch.org/whl/cpu torch
#     pip install kb-mcp
# scripts/deploy-mu2e.sh does exactly this.
#
# Parsing and importing documents are a separate activity from serving and stay
# in the [ingest] extra -- the serve path never imports kb_mcp.parser or
# kb_mcp.imports, and [ingest] is what needs the libmagic system library.
dependencies = [
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",          # kb_mcp.config imports anyio.Path at module level

    # Server dependencies
    "mcp>=2.0.0", # 2.x makes the Host checking added in 1.23 disablable (TransportSecuritySettings), which is what kept us pinned below it.
    "uvicorn>=0.27.0",
    "starlette>=0.37.0",     # imported directly in ~10 modules; do not rely on mcp pulling it
    "httpx>=0.27.0",

    # KB dependencies (database)
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0",  # PostgreSQL vector extension support

    # LLM dependencies (agent tools, OpenAI-compatible embedding provider)
    "openai>=1.0.0",

    # Chunking dependencies
    "tiktoken>=0.5.0",

    # Search/graph runtime -- numpy backs the in-Python cosine-similarity
    # fallback in kb.search.search_fallback, tqdm is imported at module level
    # by kb.graph.extraction. Both used to arrive transitively via
    # sentence-transformers; they are direct dependencies, so declare them.
    "numpy>=1.24.0",
    "tqdm>=4.65.0",

    # Embedding: the default provider. See the note above about torch's size.
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
# Document ingestion: parsing, format handling and external importers.
# Needed by `kb-import`, `kb-parse` and `kb tools ingest` -- NOT by the servers.
# python-magic additionally needs the libmagic system library.
ingest = [
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "python-magic>=0.4.27",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

# Plotting for the scripts under analysis/ (not imported by the package).
analysis = [
    "matplotlib>=3.7.0",
]

# Everything needed to both serve and ingest.
all = [
    "kb-mcp[ingest]",
]

# Google Cloud Platform integration (Firestore for session storage)
gcp = [
    "google-cloud-firestore>=2.14.0",
]

# Documentation dependencies (for building docs with MkDocs)
doc = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

# Test dependencies
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fastapi[all]", # For TestClient and web testing
    "reportlab",
]

# ALCF
alcf = [
    "globus_sdk"
]

# Azure AI Document Intelligence parser
azure = [
    "azure-ai-documentintelligence>=1.0.0",
]

# IBM Docling — high-quality PDF → Markdown via DocLayNet + TableFormer.
# Optional because the model weights are large (~500 MB) and download from
# Hugging Face on first use (set HF_HOME to a roomy cache location).
docling = [
    "docling>=2.91.0",
]

# Marker-pdf — alternative high-quality PDF → Markdown parser kept for
# benchmarking against Docling. Same caveat about model weights.
marker = [
    "marker-pdf",
]

[project.scripts]
# Server module CLI commands
kb-server = "kb_mcp.server.server:main"
kb-server-stdio = "kb_mcp.server.mcp_stdio:main"
kb-server-manage-keys = "kb_mcp.server.oauth.cli_manage_keys:main"

# Knowledge Base module CLI commands
kb = "kb_mcp.kb.cli.__main__:main"

# Import module CLI commands
kb-import = "kb_mcp.imports.cli:main"

# Parser module CLI commands
kb-parse = "kb_mcp.parser.cli:main"

# Agent module CLI commands
kb-agent = "kb_mcp.agents.cli:main"

# Ship the deployment launcher and unit installer into the venv's bin/, next
# to the kb-server entry point. This is what lets the systemd ExecStart be a
# single self-contained path and lets the unit be re-rendered later without a
# checkout. Note that an editable install (pip install -e .) does NOT process
# these, so they only appear in a real install -- which is what deployments use.
[tool.hatch.version]
path = "src/kb_mcp/__init__.py"

# Non-secret deployment defaults, shipped into the venv as
# share/kb-mcp/mu2e.env so the running service reads settings that are
# versioned with the release rather than from a working checkout.
[tool.hatch.build.targets.wheel.shared-data]
"deploy/mu2e.env" = "share/kb-mcp/mu2e.env"

[tool.hatch.build.targets.wheel.shared-scripts]
"scripts/kb-mcp.sh" = "kb-mcp.sh"
"scripts/kb-mcp-install-unit.sh" = "kb-mcp-install-unit.sh"
# The deployment guide's verify step used to require a checkout on the deploy
# host, which the install deliberately does not need.
"scripts/smoke_test_http.py" = "kb-mcp-smoke-test"

[project.urls]
Repository = "https://github.com/Mu2e/kb-mcp"
