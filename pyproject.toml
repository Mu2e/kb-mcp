[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-mcp"
version = "0.1.0"
description = "Knowledge Base MCP server with GitHub OAuth authentication"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Core dependencies - includes everything needed for server, KB, parsing, LLM, chunking, embedding, and imports
dependencies = [
    "python-dotenv>=1.0.0",

    # Server dependencies
    "mcp>=1.1.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",

    # KB dependencies (database)
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",

    # Parser dependencies
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "python-magic>=0.4.27",
    "python-pptx>=0.6.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",

    # LLM dependencies
    "openai>=1.0.0",

    # Chunking dependencies
    "tiktoken>=0.5.0",
    
    # Embedding dependencies
    "sentence-transformers>=2.2.0",
    "pgvector>=0.2.0",  # PostgreSQL vector extension support
]

[project.optional-dependencies]
# Google Cloud Platform integration (Firestore for session storage)
gcp = [
    "google-cloud-firestore>=2.14.0",
]

# Documentation dependencies (for building docs with MkDocs)
doc = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.scripts]
# Server module CLI commands
kb-server = "kb_mcp.server:main"
kb-server-stdio = "kb_mcp.server.mcp_stdio:main"
kb-server-manage-keys = "kb_mcp.server.cli_manage_keys:main"

# Knowledge Base module CLI commands
kb = "kb_mcp.kb.cli:main"

# Import module CLI commands
kb-import = "kb_mcp.imports.cli:main"

# Parser module CLI commands
kb-parse = "kb_mcp.parser.cli:main"

[project.urls]
Repository = "https://github.com/corrodis/kb-mcp"
