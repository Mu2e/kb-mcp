name: tests

on:
  push:
    branches: [main, mu2e, sld]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (pyproject requires-python = ">=3.10") and the
        # version used for development.
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Create environment
        run: uv venv --python ${{ matrix.python-version }}

      # The embedding model's weights (~130 MB) are downloaded on first use.
      # Cache them so the chunking tests that need a real token window run
      # without re-fetching from the Hub on every job.
      - name: Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-en-v1.5

      - name: Install CPU-only torch
        # sentence-transformers is a core dependency (it is the default
        # embedding provider), and on Linux torch resolves to the CUDA build
        # from PyPI -- several GB of NVIDIA wheels that CI has no use for.
        # Installing the +cpu build first leaves torch already satisfied.
        run: uv pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install kb_mcp and unit-test dependencies
        # Replaces the hand-maintained requirements-unit-tests.txt: the extras
        # in pyproject now describe this, so the two cannot drift. [ingest] is
        # needed because tests/unit exercises the parsers.
        run: uv pip install -e ".[ingest,test]"

      - name: Run unit tests
        run: uv run pytest tests/unit -v
