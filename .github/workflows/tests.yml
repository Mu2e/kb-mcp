name: tests

on:
  push:
    branches: [main, mu2e, sld]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (pyproject requires-python = ">=3.10") and the
        # version used for development.
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Create environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install kb_mcp and unit-test dependencies
        # A plain install is enough now that the core dependencies are
        # serve-only: sentence-transformers, torch and the CUDA wheels moved
        # to the [local-embed] extra, and the parser stack to [ingest]. This
        # replaces the hand-maintained requirements-unit-tests.txt, which
        # existed solely to keep those multi-GB wheels out of CI.
        #
        # [ingest] is needed because tests/unit exercises the parsers. The
        # four tests that need a real embedding model are marked
        # requires_embedder (tests/conftest.py) and skip here.
        run: uv pip install -e ".[ingest,test]"

      - name: Run unit tests
        run: uv run pytest tests/unit -v
